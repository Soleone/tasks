[package]
name = "tasks"
version = "0.1.0"
description = "Local-first tasks for people and their agents"
authors = ["Tasks contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tasks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
# 2.8 needs tauri 2.12, and its fs dependency is pinned to 2.5 in Cargo.lock for the same reason.
tauri-plugin-dialog = "~2.7"
# 2.4 needs tauri 2.12.
tauri-plugin-global-shortcut = "~2.3"
# 2.4 needs tauri 2.12.
tauri-plugin-process = "~2.3"
tauri-plugin-shell = "2"
# 2.5 needs tauri 2.12.
tauri-plugin-single-instance = "~2.4"
# 2.13 needs tauri 2.12.
tauri-plugin-updater = "~2.12"
# 2.5 needs tauri 2.12, ahead of @tauri-apps/api.
tauri-plugin-window-state = "~2.4"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }

[package]
name = "tasks"
version = "0.1.0"
description = "Local-first tasks for people and their agents"
authors = ["Tasks contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tasks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Diagnostic builds only: lets Safari's Web Inspector attach to a release build.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde_json = "1"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-dialog = "~2.8"
tauri-plugin-global-shortcut = "~2.4"
tauri-plugin-process = "~2.4"
tauri-plugin-shell = "2.6"
tauri-plugin-single-instance = "~2.5"
tauri-plugin-updater = "~2.14"
tauri-plugin-window-state = "~2.5"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }

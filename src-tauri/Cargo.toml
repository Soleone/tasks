[package]
name = "tasks"
version = "0.1.0"
description = "Local-first tasks for people and their agents"
authors = ["Tasks contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tasks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

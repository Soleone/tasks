name = "tasks-feedback"
main = "worker.ts"
compatibility_date = "2026-10-01"

# A person sends a report or two; anything faster from one address is spam.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

# Today's report counts, per address and in total.
[[kv_namespaces]]
binding = "COUNTS"
id = "d9ae3611702844d697b52e96b4cc3432"

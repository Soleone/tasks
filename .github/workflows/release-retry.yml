name: Retry release

# Network blips on a runner (a timed-out download) fail a release that passes on a second try, so a
# failed Release reruns its failed jobs once. A real failure fails again and stays failed.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: gh run rerun "${{ github.event.workflow_run.id }}" --failed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

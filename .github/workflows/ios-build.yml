name: iOS test build

# An unsigned IPA for sideloading; no Apple developer account is involved.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Set up Rust for iPhones
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      # The Xcode project is generated, not committed.
      - run: pnpm tauri ios init
      - name: Check the app is built for iPhone and iPad, not as a scaled phone app
        run: grep -rq 'TARGETED_DEVICE_FAMILY = "1,2"' src-tauri/gen/apple/*.xcodeproj/project.pbxproj
      # Inside Xcode, pnpm finds another environment, wants to reinstall and stops for lack of a terminal.
      - name: Have Xcode call the Tauri CLI directly, not through pnpm
        run: |
          cd src-tauri/gen/apple
          grep -q 'pnpm tauri ios xcode-script' *.xcodeproj/project.pbxproj
          sed -i '' 's|pnpm tauri ios xcode-script|../../../node_modules/.bin/tauri ios xcode-script|' *.xcodeproj/project.pbxproj project.yml
      - run: pnpm tauri icon src-tauri/app-icon/manifest.json
      # A test build: Safari's Web Inspector on a Mac can attach to it.
      - run: pnpm tauri ios build --no-sign --features devtools
      - uses: actions/upload-artifact@v7
        with:
          name: tasks-ios-unsigned-${{ github.sha }}
          path: src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
          retention-days: 14

name: Android Node runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - scripts/android-node.mjs
      - .github/workflows/android-runtime.yml
  # GitHub evicts caches unused for seven days. Keep the main-branch cache warm.
  schedule:
    - cron: "17 6 * * 1,4"

permissions:
  contents: read

concurrency:
  group: android-node-runtime
  cancel-in-progress: false

jobs:
  runtime:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version-file: package.json
      - name: Restore compiled Android Node runtime
        id: runtime
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/tasks-android/node-*/out/Release/node
          key: android-node-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-ndk27.3.13750724-${{ hashFiles('scripts/android-node.mjs') }}
      - uses: actions/setup-java@v6
        if: steps.runtime.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        if: steps.runtime.outputs.cache-hit != 'true'
        with:
          packages: "ndk;27.3.13750724"
      - name: Compile Android Node runtime without signing keys
        if: steps.runtime.outputs.cache-hit != 'true'
        run: NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724" node scripts/android-node.mjs
      - name: Save runtime for all release tags
        if: steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/tasks-android/node-*/out/Release/node
          key: ${{ steps.runtime.outputs.cache-primary-key }}

name: Build Android Node runtime

# Runtime maintenance only. Normal app releases download the pinned prebuilt binary.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-node-runtime
  cancel-in-progress: false

jobs:
  runtime:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "ndk;27.3.13750724"
      - name: Compile Android Node runtime without signing keys
        run: NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724" node scripts/build-android-node.mjs
      - name: Package runtime and generate checksum pin
        id: package
        run: |
          version=$(node --print process.version)
          tag=$(node scripts/package-android-runtime.mjs "$HOME/.cache/tasks-android/node-$version-arm64/out/Release/node" runtime-assets)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish a non-latest runtime dependency
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          if gh release view "$TAG"; then
            echo "Refusing to replace an existing runtime dependency: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" runtime-assets/* --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Build dependency: Android ARM64 Node $(node --print process.version)" \
            --notes 'Infrastructure dependency, not an app release. Download android-runtime.json and commit it as scripts/android-runtime.json to select this runtime. Both archive and executable SHA-256 values are pinned. This release must not become the latest Tasks app release.'
